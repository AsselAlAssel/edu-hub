<!doctype html>
<!--
  Source of public/images/og-cover.png (the Open Graph / Twitter card, 1200×630).
  Edit, then re-render:
    npx playwright screenshot --viewport-size=1200,630 --wait-for-timeout=1500 scripts/og-cover.html public/images/og-cover.png
  Then shrink it (WhatsApp may skip previews over ~300KB):
    node -e "require('sharp')('public/images/og-cover.png').png({palette:true,quality:90}).toBuffer().then(b=>require('fs').writeFileSync('public/images/og-cover.png',b))"
-->
<html lang="ar" dir="rtl">
	<head>
		<meta charset="utf-8" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@500;600;700&display=block"
			rel="stylesheet"
		/>
		<style>
			/* Dark "Neon Physics" tokens (theme/tokens.ts). */
			:root {
				--bg: #050816;
				--surface: #0a1024;
				--elevated: #17244a;
				--border: rgba(148, 163, 184, 0.18);
				--text: #f8fafc;
				--text-2: #cbd5e1;
				--muted: #94a3b8;
				--cyan: #22d3ee;
				--azure: #38bdf8;
				--blue: #0284c7;
				--violet: #8b5cf6;
				--success: #34d399;
			}
			* {
				box-sizing: border-box;
				margin: 0;
			}
			body {
				width: 1200px;
				height: 630px;
				overflow: hidden;
				background: var(--bg);
				color: var(--text);
				font-family: "IBM Plex Sans Arabic", sans-serif;
			}
			.latin {
				font-family: "Inter", sans-serif;
			}
			.canvas {
				position: relative;
				width: 100%;
				height: 100%;
				display: flex;
				align-items: center;
				padding: 0 72px;
				gap: 40px;
				background:
					radial-gradient(520px 380px at 88% 8%, rgba(34, 211, 238, 0.22), transparent 70%),
					radial-gradient(560px 420px at 10% 95%, rgba(139, 92, 246, 0.28), transparent 70%),
					radial-gradient(420px 300px at 30% 30%, rgba(56, 189, 248, 0.1), transparent 70%);
			}
			/* Lab grid, fading toward the edges. */
			.canvas::before {
				content: "";
				position: absolute;
				inset: 0;
				background-image:
					linear-gradient(rgba(34, 211, 238, 0.08) 1px, transparent 1px),
					linear-gradient(90deg, rgba(34, 211, 238, 0.08) 1px, transparent 1px);
				background-size: 42px 42px;
				mask-image: radial-gradient(ellipse at center, #000 35%, transparent 80%);
			}
			/* Thin lit edge along the top. */
			.canvas::after {
				content: "";
				position: absolute;
				inset: 0 0 auto;
				height: 4px;
				background: linear-gradient(90deg, var(--violet), var(--azure), var(--cyan));
			}

			/* ---------- Text side (right in RTL) ---------- */
			.copy {
				position: relative;
				flex: 1;
				z-index: 1;
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 14px;
				margin-bottom: 30px;
			}
			.brand-mark {
				width: 58px;
				height: 58px;
				display: grid;
				place-items: center;
				border-radius: 16px;
				background: rgba(23, 36, 74, 0.8);
				border: 1px solid rgba(34, 211, 238, 0.35);
				box-shadow: 0 0 28px rgba(34, 211, 238, 0.25);
			}
			.brand-mark img {
				width: 38px;
				height: 38px;
			}
			.brand-name {
				font-size: 26px;
				font-weight: 700;
				line-height: 1.2;
			}
			.brand-sub {
				font-size: 16px;
				font-weight: 500;
				color: var(--cyan);
			}
			h1 {
				font-size: 74px;
				font-weight: 700;
				line-height: 1.18;
				letter-spacing: -0.5px;
			}
			h1 .glow {
				background: linear-gradient(100deg, var(--cyan) 0%, var(--azure) 50%, var(--violet) 100%);
				-webkit-background-clip: text;
				background-clip: text;
				color: transparent;
				/* Room for Arabic descenders inside the clipped box. */
				padding-bottom: 8px;
			}
			.lead {
				margin-top: 18px;
				font-size: 24px;
				line-height: 1.6;
				color: var(--text-2);
			}
			.features {
				display: flex;
				gap: 8px;
				margin-top: 28px;
			}
			.chip {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				padding: 8px 14px;
				border-radius: 999px;
				font-size: 17px;
				white-space: nowrap;
				font-weight: 600;
				background: rgba(23, 36, 74, 0.7);
				border: 1px solid var(--border);
			}
			.chip svg {
				width: 20px;
				height: 20px;
				color: var(--cyan);
			}
			.chip.new {
				border-color: rgba(139, 92, 246, 0.6);
				background: rgba(139, 92, 246, 0.18);
			}
			.chip.new svg {
				color: #c4b5fd;
			}
			.url {
				display: flex;
				align-items: center;
				gap: 10px;
				margin-top: 34px;
				font-size: 21px;
				font-weight: 600;
				color: var(--muted);
				direction: ltr;
				justify-content: flex-end;
			}
			.url::before {
				content: "";
				width: 10px;
				height: 10px;
				border-radius: 50%;
				background: var(--cyan);
				box-shadow: 0 0 12px var(--cyan);
			}

			/* ---------- Visual side (left in RTL) ---------- */
			.visual {
				position: relative;
				width: 400px;
				height: 540px;
				flex: none;
				z-index: 1;
			}
			/* Atom orbits behind the cards. */
			.orbits {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				opacity: 0.55;
			}
			.card {
				position: absolute;
				border-radius: 20px;
				background: rgba(10, 16, 36, 0.86);
				border: 1px solid rgba(34, 211, 238, 0.28);
				box-shadow:
					0 24px 60px rgba(0, 0, 0, 0.55),
					0 0 0 1px rgba(255, 255, 255, 0.02) inset;
				backdrop-filter: blur(8px);
			}
			.video {
				top: 20px;
				left: 10px;
				width: 330px;
				padding: 14px;
				transform: rotate(-4deg);
			}
			.thumb {
				position: relative;
				height: 176px;
				border-radius: 14px;
				display: grid;
				place-items: center;
				overflow: hidden;
				background:
					radial-gradient(circle at 70% 30%, rgba(255, 255, 255, 0.18), transparent 50%),
					linear-gradient(120deg, var(--azure), var(--violet));
			}
			.thumb .formula {
				position: absolute;
				top: 14px;
				left: 16px;
				font-size: 22px;
				font-weight: 700;
				color: rgba(255, 255, 255, 0.85);
			}
			.play {
				width: 66px;
				height: 66px;
				border-radius: 50%;
				display: grid;
				place-items: center;
				background: rgba(5, 8, 22, 0.45);
				border: 2px solid rgba(255, 255, 255, 0.6);
			}
			.bar {
				position: absolute;
				inset: auto 0 0;
				height: 6px;
				background: rgba(0, 0, 0, 0.35);
			}
			.bar i {
				display: block;
				width: 72%;
				height: 100%;
				background: #fff;
			}
			.video-meta {
				display: flex;
				align-items: center;
				justify-content: space-between;
				margin-top: 12px;
			}
			.video-title {
				font-size: 19px;
				font-weight: 700;
			}
			.done {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				padding: 4px 12px;
				border-radius: 999px;
				font-size: 14px;
				font-weight: 700;
				color: #03101c;
				background: var(--success);
			}
			.exam {
				bottom: 0;
				right: 0;
				width: 220px;
				padding: 18px;
				text-align: center;
				transform: rotate(3deg);
				border-color: rgba(139, 92, 246, 0.45);
			}
			.ring {
				position: relative;
				width: 104px;
				height: 104px;
				margin: 0 auto 10px;
			}
			.ring span {
				position: absolute;
				inset: 0;
				display: grid;
				place-items: center;
				font-size: 28px;
				font-weight: 700;
			}
			.exam-title {
				font-size: 17px;
				font-weight: 700;
			}
			.exam-sub {
				margin-top: 2px;
				font-size: 14px;
				color: var(--muted);
			}
			.lock {
				bottom: 60px;
				left: 0;
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 12px 16px;
				transform: rotate(-3deg);
				font-size: 16px;
				font-weight: 700;
			}
			.lock svg {
				width: 24px;
				height: 24px;
				color: var(--success);
			}
		</style>
	</head>
	<body>
		<main class="canvas">
			<section class="copy">
				<div class="brand">
					<div class="brand-mark"><img src="../public/images/logo/logo.svg" alt="" /></div>
					<div>
						<div class="brand-name">محمد صبح</div>
						<div class="brand-sub">منصة الفيزياء</div>
					</div>
				</div>

				<h1>
					افهم الفيزياء<br />
					<span class="glow">ولا تحفظها</span>
				</h1>
				<p class="lead">شروحات فيديو لكل الصفوف مع الأستاذ محمد صبح</p>

				<div class="features">
					<span class="chip">
						<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72L19 12z" /></svg>
						فيديوهات شرح
					</span>
					<span class="chip">
						<svg viewBox="0 0 24 24" fill="currentColor">
							<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zm-1 7V3.5L18.5 9z" />
						</svg>
						ملفات دراسية
					</span>
					<span class="chip new">
						<svg viewBox="0 0 24 24" fill="currentColor">
							<path
								d="M19 3h-4.18A3 3 0 0 0 12 1a3 3 0 0 0-2.82 2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2m-7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2m-2 14-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9z"
							/>
						</svg>
						امتحانات
					</span>
					<span class="chip">
						<svg viewBox="0 0 24 24" fill="currentColor">
							<path d="m3.5 18.49 6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z" />
						</svg>
						تتبّع تقدّمك
					</span>
				</div>

				<div class="url latin">mohammedsubuh.com</div>
			</section>

			<section class="visual">
				<svg class="orbits" viewBox="0 0 430 520" fill="none">
					<g transform="translate(215 260)" stroke-width="1.5">
						<ellipse rx="200" ry="70" stroke="#22D3EE" stroke-opacity="0.5" transform="rotate(30)" />
						<ellipse rx="200" ry="70" stroke="#8B5CF6" stroke-opacity="0.55" transform="rotate(-30)" />
						<ellipse rx="200" ry="70" stroke="#38BDF8" stroke-opacity="0.4" transform="rotate(90)" />
						<circle r="7" fill="#22D3EE" />
						<circle cx="173" cy="100" r="5" fill="#22D3EE" transform="rotate(0)" />
						<circle cx="-150" cy="140" r="5" fill="#8B5CF6" />
					</g>
				</svg>

				<div class="card video">
					<div class="thumb">
						<span class="formula latin">F = ma</span>
						<div class="play">
							<svg width="30" height="30" viewBox="0 0 24 24" fill="#fff"><path d="M8 5.14v13.72L19 12z" /></svg>
						</div>
						<div class="bar"><i></i></div>
					</div>
					<div class="video-meta">
						<span class="video-title">قوانين نيوتن للحركة</span>
						<span class="done">✓ مكتمل</span>
					</div>
				</div>

				<div class="card lock">
					<svg viewBox="0 0 24 24" fill="currentColor">
						<path
							d="M12 17a2 2 0 1 0 0-4 2 2 0 0 0 0 4m6-9h-1V6A5 5 0 0 0 7 6h1.9a3.1 3.1 0 0 1 6.2 0v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2"
						/>
					</svg>
					وحدة مفتوحة لك
				</div>

				<div class="card exam">
					<div class="ring">
						<svg width="104" height="104" viewBox="0 0 104 104" style="transform: rotate(-90deg)">
							<circle cx="52" cy="52" r="42" fill="none" stroke="rgba(148,163,184,0.2)" stroke-width="10" />
							<circle
								cx="52"
								cy="52"
								r="42"
								fill="none"
								stroke="url(#score)"
								stroke-width="10"
								stroke-linecap="round"
								pathLength="100"
								stroke-dasharray="90 100"
							/>
							<defs>
								<linearGradient id="score" x1="0" y1="0" x2="1" y2="1">
									<stop offset="0" stop-color="#22D3EE" />
									<stop offset="1" stop-color="#34D399" />
								</linearGradient>
							</defs>
						</svg>
						<span class="latin">90%</span>
					</div>
					<div class="exam-title">نتيجة الامتحان</div>
					<div class="exam-sub"><span class="latin">9</span> من <span class="latin">10</span> صحيحة</div>
				</div>
			</section>
		</main>
	</body>
</html>
